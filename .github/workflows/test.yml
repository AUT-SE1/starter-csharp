name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The contract tests skip here: no NEIGHBOR_BASE_URL is set, and there
      # is no neighbouring team's sandbox for CI to reach.
      - name: Test
        run: dotnet test tests/StarterService.Tests --logger "console;verbosity=normal"
